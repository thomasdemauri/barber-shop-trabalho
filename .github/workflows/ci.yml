name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: barbershop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/barbershop_test
      # Enable the integration specs (Prisma adapters, publisher -> RabbitMQ -> worker).
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/barbershop_test
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:types
      - run: npm test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Full docker-compose stack with simulated e-mails and an empty agenda.
      EMAIL_PROVIDER: memory
      SEED_DEMO_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Wait for the API behind Nginx
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:5173/api/catalog/services > /dev/null && exit 0
            sleep 2
          done
          echo "API did not become ready" && exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Azure Container Apps
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC login to Azure, no client secret stored
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy registry
        id: registry
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name registry \
            --template-file infra/registry.bicep \
            --query properties.outputs -o json)
          echo "name=$(jq -r .registryName.value <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "login-server=$(jq -r .loginServer.value <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "identity=$(jq -r .identityName.value <<<"$outputs")" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        run: az acr login --name "${{ steps.registry.outputs.name }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend (API + notification worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.login-server }}/barbershop-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.login-server }}/barbershop-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy infrastructure and apps
        id: apps
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'memory' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'Navalha de Ouro <nao-responda@barbearia.test>' }}
          SEED_DEMO_DATA: ${{ vars.SEED_DEMO_DATA || 'true' }}
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name apps \
            --template-file infra/main.bicep \
            --parameters \
              registryName="${{ steps.registry.outputs.name }}" \
              identityName="${{ steps.registry.outputs.identity }}" \
              imageTag="$IMAGE_TAG" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              jwtSecret="$JWT_SECRET" \
              rabbitmqPassword="$RABBITMQ_PASSWORD" \
              brevoApiKey="$BREVO_API_KEY" \
              emailProvider="$EMAIL_PROVIDER" \
              emailFrom="$EMAIL_FROM" \
              seedDemoData="$SEED_DEMO_DATA" \
            --query properties.outputs -o json)
          url=$(jq -r .frontendUrl.value <<<"$outputs")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fs "${{ steps.apps.outputs.url }}/api/catalog/services" > /dev/null && exit 0
            sleep 10
          done
          echo "Deployed app did not answer" && exit 1
